[package]
name = "silicon-peek-cli"
description = "The peek command-line interface: IAM login, positions, drawings and speak/show/ask bubbles on a Mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["peek", "silicon", "iam", "cli", "macos"]
categories = ["command-line-utilities"]
build = "build.rs"
# The crate is self-contained on crates.io: the manuals travel with it.
include = ["src/**", "docs/**", "tests/**", "build.rs", "README.md", "Cargo.toml"]

[[bin]]
name = "peek"
path = "src/main.rs"

[dependencies]
silicon-peek-client = { workspace = true, features = ["runtime"] }
clap.workspace = true
hex.workspace = true
# `--at` / `--expires-at` / `--tz`: the Mac's zone and the IANA database
# (/usr/share/zoneinfo, bundled on Windows), with DST gaps and folds (contract §5.1).
jiff = { version = "0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "macros",
  "time",
  "net",
  "io-util",
  "process",
  "fs",
  "sync",
] }
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
blake3.workspace = true
silicon-peek-client = { workspace = true, features = ["runtime"] }
tempfile.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "net",
  "io-util",
  "process",
  "fs",
  "sync",
] }
wiremock.workspace = true

[lints]
workspace = true
