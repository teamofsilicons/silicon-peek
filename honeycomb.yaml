# honeycomb.yaml — package format 1. No install_script: Honeycomb < 0.5.0 rejects it and would abort `silicon connect`.
format_version: 1
app_id: "peek"
version: "0.1.1"            # == every Cargo.toml version == CFBundleShortVersionString; git tag v0.1.1
bin:
  peek: "cli"
targets:
  macos-aarch64:   { root: "targets/macos-aarch64",   executables: { cli: "bin/peek" } }
  macos-x86_64:    { root: "targets/macos-x86_64",    executables: { cli: "bin/peek" } }
  linux-x86_64:    { root: "targets/linux-x86_64",    executables: { cli: "bin/peek" } }
  linux-aarch64:   { root: "targets/linux-aarch64",   executables: { cli: "bin/peek" } }
  windows-x86_64:  { root: "targets/windows-x86_64",  executables: { cli: "bin/peek.exe" } }
  windows-aarch64: { root: "targets/windows-aarch64", executables: { cli: "bin/peek.exe" } }
