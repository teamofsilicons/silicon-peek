# honeycomb.yaml — package format 1, Manifest A: the macOS targets run install-app.sh (Honeycomb >= 0.5.0; every client is).
format_version: 1
app_id: "peek"
version: "0.1.3"            # == every Cargo.toml version == CFBundleShortVersionString; git tag v0.1.3
bin:
  peek: "cli"
targets:
  macos-aarch64:   { root: "targets/macos-aarch64",   executables: { cli: "bin/peek" }, install_script: "install-app.sh" }
  macos-x86_64:    { root: "targets/macos-x86_64",    executables: { cli: "bin/peek" }, install_script: "install-app.sh" }
  linux-x86_64:    { root: "targets/linux-x86_64",    executables: { cli: "bin/peek" } }
  linux-aarch64:   { root: "targets/linux-aarch64",   executables: { cli: "bin/peek" } }
  windows-x86_64:  { root: "targets/windows-x86_64",  executables: { cli: "bin/peek.exe" } }
  windows-aarch64: { root: "targets/windows-aarch64", executables: { cli: "bin/peek.exe" } }
