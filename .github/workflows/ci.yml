name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"
  RUSTUP_TOOLCHAIN: "1.98.0"

jobs:
  rust-linux:
    name: Rust on Linux (client, CLI, server)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      # peekd is macOS-only (compile_error! elsewhere); it is checked in rust-macos.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude silicon-peek-daemon --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --exclude silicon-peek-daemon

  rust-macos:
    name: Rust on macOS (daemon, CLI, client)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -p silicon-peek-daemon -p silicon-peek-cli -p silicon-peek-client --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -p silicon-peek-daemon -p silicon-peek-cli -p silicon-peek-client

  dependency-policy:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: ${{ env.RUST_TOOLCHAIN }}

  rust-windows:
    name: Rust on Windows (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Tests
        run: cargo test --locked --no-fail-fast -p silicon-peek-client -p silicon-peek-cli --target ${{ matrix.target }}

  web:
    name: Website and docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  swift:
    name: Peek.app build and tests (Swift 6)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$xcode" ] || { echo "No Xcode 26 on this runner image" >&2; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # apps/mac/scripts/embed-peekd.sh copies dist/peekd into Contents/Helpers (BLUEPRINT §8.1).
      - name: Build peekd for the host
        run: |
          MACOSX_DEPLOYMENT_TARGET=26.0 cargo build --locked --release -p silicon-peek-daemon
          mkdir -p dist
          cp target/release/peekd dist/peekd
      - name: Generate the Xcode project
        working-directory: apps/mac
        run: xcodegen generate --spec project.yml
      - name: Build (unsigned; CI never holds a signing identity for this job)
        run: |
          xcodebuild -project apps/mac/Peek.xcodeproj -scheme Peek -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Xcode tests
        run: |
          if grep -Eq 'type:[[:space:]]*bundle\.unit-test' apps/mac/project.yml; then
            xcodebuild -project apps/mac/Peek.xcodeproj -scheme Peek -configuration Debug \
              -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO test
          else
            echo "apps/mac/project.yml declares no unit-test target"
          fi
      - name: Swift package tests
        run: |
          for manifest in apps/mac/Packages/*/Package.swift; do
            [ -e "$manifest" ] || continue
            package=$(dirname "$manifest")
            if [ -d "$package/Tests" ]; then
              # UI tests share the main actor and real timers; avoid deadline contention.
              swift test --no-parallel --package-path "$package"
            else
              swift build --package-path "$package"
            fi
          done
      - name: Packaging tests that need macOS (install-app.sh, codesign round trip helpers)
        run: python3 -m unittest discover -s scripts/tests

  repo-checks:
    name: Scripts, docs sync, installer identity, versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py scripts/tests/*.py deploy/*.py deploy/tests/*.py
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x $(ls scripts/*.sh scripts/lib/*.sh scripts/operator/*.sh scripts/testing/*.sh deploy/install.sh | grep -v '^scripts/install.sh$')
          # scripts/install.sh is byte-identical to BLUEPRINT §9.4; its literal backticks in printf are intended.
          shellcheck -e SC2016 scripts/install.sh
      - name: Packaging and deploy tool tests
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s deploy/tests
      - name: CLI docs are in sync with docs/
        run: python3 scripts/sync-cli-docs.py --check
      - name: Installer identity (scripts/install.sh == web/public/install.sh)
        run: sh scripts/check-installer.sh
      - name: One version everywhere
        run: python3 scripts/package-honeycomb.py --check-versions
